<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIỂM KÊ CUỐI THÁNG</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top left,#1e293b,#0f172a 60%);
  min-height:100vh;padding:18px;color:white;
}

.container{
  max-width:600px;margin:auto;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:28px;padding:24px;
  box-shadow:0 20px 40px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.1);
}

h2{
  text-align:center;font-size:24px;margin-bottom:22px;
  font-weight:900;letter-spacing:1px;color:#fff;
  text-shadow:0 4px 15px rgba(0,0,0,0.4);
}

.section-label{
  font-size:10px;font-weight:700;letter-spacing:2px;
  color:#64748b;text-transform:uppercase;
  margin:20px 0 8px 2px;display:flex;align-items:center;gap:6px;
}
.section-label::after{
  content:"";flex:1;height:1px;background:rgba(255,255,255,0.08);
}

/* INPUT */
.field{margin-bottom:10px;}

.field label{
  display:block;font-size:12px;font-weight:600;
  color:#94a3b8;margin-bottom:5px;letter-spacing:0.5px;
}

.field input,
.field select,
.field textarea{
  width:100%;padding:13px 15px;border:none;border-radius:14px;
  background:rgba(255,255,255,0.11);color:white;font-size:15px;
  outline:none;transition:0.2s;font-family:inherit;
  box-shadow:inset 2px 2px 6px rgba(0,0,0,0.3),inset -1px -1px 4px rgba(255,255,255,0.06);
  -webkit-appearance:none;appearance:none;
}
.field select option{background:#1e293b;color:white;}
.field input:focus,.field select:focus,.field textarea:focus{
  background:rgba(255,255,255,0.16);
  box-shadow:0 0 0 2px rgba(99,102,241,0.5),inset 2px 2px 6px rgba(0,0,0,0.2);
}
.field input::placeholder,.field textarea::placeholder{color:#64748b;}
.field textarea{resize:none;height:75px;line-height:1.5;}

/* ROW 2 COL */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* INPUT WITH CAMERA */
.input-cam-wrap{position:relative;}
.input-cam-wrap input{padding-right:50px;}
.cam-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:rgba(99,102,241,0.25);border:1px solid rgba(99,102,241,0.4);
  color:#a5b4fc;font-size:18px;cursor:pointer;
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  transition:0.2s;padding:0;box-shadow:none;font-weight:normal;
}
.cam-btn:hover{background:rgba(99,102,241,0.45);transform:translateY(-50%) scale(1.08);box-shadow:none;}
.cam-btn:active{transform:translateY(-50%) scale(0.95);box-shadow:none;}

/* PHONE ERROR */
.field-error{color:#f87171;font-size:11px;margin-top:4px;display:none;}

/* RADIO STATUS */
.radio-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.radio-card{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,0.07);
  border:2px solid rgba(255,255,255,0.08);
  font-weight:700;font-size:15px;transition:0.2s;
  user-select:none;
}
.radio-card input{display:none;}
.radio-card.ok:has(input:checked){
  background:rgba(34,197,94,0.2);border-color:#22c55e;
  box-shadow:0 0 16px rgba(34,197,94,0.25);
}
.radio-card.ko:has(input:checked){
  background:rgba(239,68,68,0.2);border-color:#ef4444;
  box-shadow:0 0 16px rgba(239,68,68,0.25);
}

/* SUBMIT BUTTON */
.btn-submit{
  width:100%;padding:16px;border:none;border-radius:16px;
  background:linear-gradient(135deg,#6366f1,#4f46e5);
  color:white;font-size:16px;font-weight:800;
  cursor:pointer;margin-top:6px;
  box-shadow:0 8px 20px rgba(99,102,241,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
  transition:0.2s;letter-spacing:0.5px;
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(99,102,241,0.5);}
.btn-submit:active{transform:translateY(2px);box-shadow:0 4px 10px rgba(99,102,241,0.3);}

/* STATUS MESSAGE */
#statusMsg{
  margin-top:14px;padding:12px 16px;border-radius:12px;
  text-align:center;font-size:14px;font-weight:600;
  display:none;
}
#statusMsg.sending{background:rgba(99,102,241,0.2);color:#a5b4fc;display:block;}
#statusMsg.success{background:rgba(34,197,94,0.2);color:#86efac;display:block;}
#statusMsg.error  {background:rgba(239,68,68,0.2); color:#fca5a5;display:block;}

/* MODAL QR */
#qrModal{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;
}
#qrModal.open{display:flex;}
.qr-modal-box{
  background:#0f172a;border:1px solid rgba(255,255,255,0.15);
  border-radius:24px;padding:20px;width:92%;max-width:420px;
  box-shadow:0 30px 60px rgba(0,0,0,0.6);
}
.qr-modal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.qr-modal-header span{font-size:15px;font-weight:700;color:#e2e8f0;}
.qr-close-btn{
  background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);
  color:#fca5a5;font-size:18px;font-weight:bold;
  width:34px;height:34px;border-radius:10px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;box-shadow:none;transition:0.2s;
}
.qr-close-btn:hover{background:rgba(239,68,68,0.4);box-shadow:none;transform:none;}
#qr-reader-modal{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:220px;}

.info{text-align:center;margin-top:18px;color:#475569;font-size:12px;}

@media(max-width:480px){
  .row2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="container">
  <h2>📋 KIỂM KÊ CUỐI THÁNG</h2>

  <!-- NHÂN VIÊN -->
  <div class="section-label">👤 Nhân viên</div>

  <div class="row2">
    <div class="field">
      <label>TÊN SALE *</label>
      <input type="text" id="saleInput" placeholder="Nhập tên Sale">
    </div>
    <div class="field">
      <label>SALE NHẬN</label>
      <input type="text" id="receiverInput" placeholder="Không bắt buộc">
    </div>
  </div>

  <!-- KHU VỰC & LIÊN HỆ -->
  <div class="section-label">🗺️ Khu vực & Liên hệ</div>

  <div class="row2">
    <div class="field">
      <label>KHU VỰC *</label>
      <select id="regionSelect">
        <option value="" disabled selected>-- Chọn --</option>
        <option value="Miền Bắc">🔵 Miền Bắc</option>
        <option value="Miền Nam">🔴 Miền Nam</option>
      </select>
    </div>
    <div class="field">
      <label>SĐT ĐĂNG KÝ MC</label>
      <input type="tel" id="phoneInput" placeholder="10 chữ số" maxlength="10" inputmode="numeric">
      <div class="field-error" id="phoneError">⚠ Phải đủ 10 chữ số</div>
    </div>
  </div>

  <!-- THIẾT BỊ -->
  <div class="section-label">🔧 Thiết bị</div>

  <div class="field">
    <label>SERIAL MÁY LẮP</label>
    <div class="input-cam-wrap">
      <input type="text" id="serialInput" placeholder="Nhập tay hoặc bấm 📷 quét">
      <button class="cam-btn" onclick="openQrModal('serial')" title="Quét QR Serial">📷</button>
    </div>
  </div>

  <div class="field">
    <label>MÃ SỐ SIM</label>
    <div class="input-cam-wrap">
      <input type="text" id="simInput" placeholder="Nhập tay hoặc bấm 📷 quét">
      <button class="cam-btn" onclick="openQrModal('sim')" title="Quét QR SIM">📷</button>
    </div>
  </div>

  <div class="row2">
    <div class="field">
      <label>THỜI GIAN HIỂN THỊ MÀN HÌNH</label>
      <input type="text" id="displayTimeInput" placeholder="VD: 30 giây">
    </div>
    <div class="field">
      <label>LOẠI DỊCH VỤ</label>
      <input type="text" id="serviceTypeInput" placeholder="VD: 4G, 5G...">
    </div>
  </div>

  <!-- GHI CHÚ & TRẠNG THÁI -->
  <div class="section-label">📝 Đánh giá</div>

  <div class="field">
    <label>GHI CHÚ</label>
    <textarea id="noteInput" placeholder="Nhập ghi chú..."></textarea>
  </div>

  <div class="field">
    <label>TRẠNG THÁI</label>
    <div class="radio-row">
      <label class="radio-card ok">
        <input type="radio" name="trangThai" value="OK">
        ✅ OK
      </label>
      <label class="radio-card ko">
        <input type="radio" name="trangThai" value="Ko">
        ❌ Ko
      </label>
    </div>
  </div>

  <button class="btn-submit" onclick="submitForm()">🚀 GỬI LÊN GOOGLE SHEET</button>

  <div id="statusMsg"></div>

  <div class="info">Được viết bởi Nguyễn Mạnh Tuấn · https://byvn.net/zbFQ</div>
</div>

<!-- MODAL CAMERA QR -->
<div id="qrModal">
  <div class="qr-modal-box">
    <div class="qr-modal-header">
      <span id="qrModalTitle">📷 Quét mã</span>
      <button class="qr-close-btn" onclick="closeQrModal()">✕</button>
    </div>
    <div id="qr-reader-modal"></div>
  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJgn0b-_P68i6NO3cFo6YRE5nEP5_lz6WV9NGVMVmT2UXi4sc-xp1Y7aAnMahvwxuJow/exec";

let activeQrScanner = null;
let activeQrField   = null;

/* ── PHONE VALIDATE ── */
document.getElementById('phoneInput').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'');
  document.getElementById('phoneError').style.display =
    (this.value.length > 0 && this.value.length !== 10) ? 'block' : 'none';
});

/* ── MODAL QR ── */
async function openQrModal(field){
  activeQrField = field;
  document.getElementById('qrModalTitle').textContent =
    field === 'serial' ? '📷 Quét Serial máy lắp' : '📷 Quét mã SIM';

  // Reset reader div để tránh lỗi "element already used"
  const container = document.getElementById('qr-reader-modal');
  container.innerHTML = '';

  document.getElementById('qrModal').classList.add('open');

  // Delay nhỏ để DOM render xong
  await new Promise(r => setTimeout(r, 80));

  try{
    activeQrScanner = new Html5Qrcode('qr-reader-modal');

    await activeQrScanner.start(
      { facingMode: { ideal: 'environment' } },
      {
        fps: 15,
        qrbox: function(w, h){ return { width: Math.floor(w*0.82), height: Math.floor(h*0.55) }; },
        aspectRatio: 1.5,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
        ],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      },
      function(decodedText){
        const inputId = field === 'serial' ? 'serialInput' : 'simInput';
        document.getElementById(inputId).value = decodedText;
        navigator.vibrate?.(80);
        closeQrModal();
      }
    );
  } catch(err){
    console.error('QR Error:', err);
    const msg = String(err);
    let userMsg = '❌ Không thể mở camera.';
    if(msg.includes('Permission') || msg.includes('permission') || msg.includes('NotAllowed')){
      userMsg = '❌ Trình duyệt chặn camera.\nVui lòng cấp quyền camera và thử lại.';
    } else if(msg.includes('NotFound') || msg.includes('Requested device not found')){
      userMsg = '❌ Không tìm thấy camera trên thiết bị.';
    } else if(msg.includes('https') || msg.includes('secure')){
      userMsg = '❌ Cần mở bằng HTTPS để dùng camera.';
    }
    closeQrModal();
    alert(userMsg);
  }
}

async function closeQrModal(){
  if(activeQrScanner){
    try{
      if(activeQrScanner.isScanning) await activeQrScanner.stop();
      activeQrScanner.clear();
    } catch(e){}
    activeQrScanner = null;
  }
  document.getElementById('qrModal').classList.remove('open');
  document.getElementById('qr-reader-modal').innerHTML = '';
  activeQrField = null;
}

// Đóng modal khi bấm ra ngoài
document.getElementById('qrModal').addEventListener('click', function(e){
  if(e.target === this) closeQrModal();
});

/* ── SUBMIT ── */
async function submitForm(){
  const sale   = document.getElementById('saleInput').value.trim();
  const region = document.getElementById('regionSelect').value;
  const phone  = document.getElementById('phoneInput').value.trim();

  if(!sale)  { alert('Vui lòng nhập tên Sale!'); return; }
  if(!region){ alert('Vui lòng chọn khu vực!'); return; }
  if(phone && phone.length !== 10){ alert('Số điện thoại phải đủ 10 chữ số!'); return; }

  const trangThai = document.querySelector('input[name="trangThai"]:checked')?.value || '';

  const params = new URLSearchParams({
    timestamp:   new Date().toLocaleString('vi-VN'),
    sale,
    receiver:    document.getElementById('receiverInput').value.trim(),
    region,
    phone,
    serial:      document.getElementById('serialInput').value.trim(),
    sim:         document.getElementById('simInput').value.trim(),
    displayTime: document.getElementById('displayTimeInput').value.trim(),
    serviceType: document.getElementById('serviceTypeInput').value.trim(),
    note:        document.getElementById('noteInput').value.trim(),
    trangThai,
  });

  showStatus('sending', '📡 Đang gửi dữ liệu...');

  try{
    await fetch(GOOGLE_SCRIPT_URL + '?' + params.toString(), {
      method: 'GET', mode: 'no-cors', cache: 'no-cache'
    });
    showStatus('success', '✅ Gửi thành công lên Google Sheet!');
    navigator.vibrate?.(150);
  } catch(err){
    console.error(err);
    showStatus('error', '❌ Lỗi gửi dữ liệu: ' + err.message);
  }
}

function showStatus(type, msg){
  const el = document.getElementById('statusMsg');
  el.className = type;
  el.textContent = msg;
  if(type === 'success'){
    setTimeout(() => { el.style.display = 'none'; el.className = ''; }, 4000);
  }
}
</script>
</body>
</html>
